<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALAZAR</title>
<style>
:root {--ouro:#b8860b;--fundo:#f8f0dc;--tinta:#2c1810;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif;}
body{background:var(--fundo);color:var(--tinta);padding:1rem;max-width:500px;margin:0 auto;}
.tela{display:block;}
.escondido{display:none !important;}
.pergaminho{background:#fff9e8;border:3px solid var(--ouro);border-radius:8px;padding:2rem;}
h1{text-align:center;color:var(--ouro);margin-bottom:1rem;}
h2{text-align:center;margin-bottom:1.5rem;}
.botao{width:100%;padding:1rem;margin:0.5rem 0;font-size:1rem;background:linear-gradient(#d4a017,#b8860b);color:#fff;border:none;border-radius:6px;cursor:pointer;}
.botao-gen{padding:0.8rem;margin:0.25rem;border:2px solid #bbaa88;border-radius:6px;background:#f5efe0;cursor:pointer;}
.botao-gen.ativo{border-color:var(--ouro);background:rgba(212,165,22,0.3);font-weight:bold;}
.opcao{padding:1rem;margin:0.5rem 0;border:2px solid transparent;border-radius:6px;background:rgba(139,90,43,0.1);cursor:pointer;}
.opcao.ativo{border-color:var(--ouro);background:rgba(212,165,22,0.2);}
.campo{width:100%;padding:0.8rem;margin:0.5rem 0;border:1px solid #d4b896;border-radius:4px;font-size:1rem;}
.voltar{background:linear-gradient(#7a5c3a,#5c442e);}
</style>
</head>
<body>

<!-- TELA INICIO -->
<div id="inicio" class="tela">
    <div class="pergaminho">
        <h1>MALAZAR</h1>
        <p style="text-align:center;margin:1rem 0 2rem;">As sombras despertaram...</p>
        <button class="botao" onclick="vaiCriar()">⚔️ Iniciar Jornada</button>
        <button class="botao" onclick="vaiHistoria()">📜 A História</button>
    </div>
</div>

<!-- TELA CRIAR -->
<div id="criar" class="tela escondido">
    <div class="pergaminho">
        <h2>Criar Herói</h2>
        
        <label><strong>Nome:</strong></label>
        <input type="text" id="nome" class="campo" placeholder="Seu nome...">
        
        <label><strong>Gênero:</strong></label>
        <div>
            <button class="botao-gen" id="gen-m" onclick="escolheGen('masc')">Masculino</button>
            <button class="botao-gen" id="gen-f" onclick="escolheGen('fem')">Feminino</button>
            <button class="botao-gen" id="gen-n" onclick="escolheGen('neutro')">Neutro</button>
        </div>
        
        <label><strong>Raça:</strong></label>
        <div id="lista-racas"></div>
        
        <label><strong>Classe:</strong></label>
        <div id="lista-classes"></div>
        
        <button class="botao" onclick="confirma()">✅ Confirmar</button>
        <button class="botao voltar" onclick="vaiInicio()">↩️ Voltar</button>
    </div>
</div>

<!-- TELA HISTÓRIA -->
<div id="historia" class="tela escondido">
    <div class="pergaminho">
        <h2>A História</h2>
        <p style="margin:1rem 0;">Malazar foi selado... mas o culto desperta.</p>
        <button class="botao" onclick="vaiInicio()">↩️ Voltar</button>
    </div>
</div>

<script>
// DADOS
const RACAS = [
    {id:'hum',nome:'Humano'},
    {id:'elf',nome:'Elfo'},
    {id:'ana',nome:'Anão'},
    {id:'meio',nome:'Meio-Sangue'}
];
const CLASSES = [
    {id:'guer',nome:'Guerreiro'},
    {id:'mag',nome:'Mago'},
    {id:'lad',nome:'Ladino'},
    {id:'sac',nome:'Sacerdote'}
];

// ESCOLHAS
let genEscolhido = null;
let racaEscolhida = null;
let classeEscolhida = null;

// TROCA DE TELA
function trocaTela(id) {
    document.querySelectorAll('.tela').forEach(t => t.classList.add('escondido'));
    document.getElementById(id).classList.remove('escondido');
}

function vaiInicio() { trocaTela('inicio'); }
function vaiHistoria() { trocaTela('historia'); }

function vaiCriar() {
    // LIMPA TUDO ANTES DE ABRIR
    genEscolhido = racaEscolhida = classeEscolhida = null;
    document.getElementById('nome').value = '';
    document.querySelectorAll('.botao-gen, .opcao').forEach(b => b.classList.remove('ativo'));
    carregaOpcoes();
    trocaTela('criar');
}

// ESCOLHA DE GÊNERO — SIMPLES E DIRETO
function escolheGen(valor) {
    genEscolhido = valor;
    // LIMPA TODOS
    document.querySelectorAll('.botao-gen').forEach(b => b.classList.remove('ativo'));
    // MARCA O ESCOLHIDO
    if(valor === 'masc') document.getElementById('gen-m').classList.add('ativo');
    if(valor === 'fem') document.getElementById('gen-f').classList.add('ativo');
    if(valor === 'neutro') document.getElementById('gen-n').classList.add('ativo');
    console.log('Gênero escolhido:', genEscolhido); // ← aparece no console
}

// CARREGA RAÇAS E CLASSES
function carregaOpcoes() {
    document.getElementById('lista-racas').innerHTML = RACAS.map(r =>
        `<div class="opcao" id="raca-${r.id}" onclick="escolheRaca('${r.id}')">${r.nome}</div>`
    ).join('');
    
    document.getElementById('lista-classes').innerHTML = CLASSES.map(c =>
        `<div class="opcao" id="classe-${c.id}" onclick="escolheClasse('${c.id}')">${c.nome}</div>`
    ).join('');
}

function escolheRaca(id) {
    racaEscolhida = id;
    document.querySelectorAll('#lista-racas .opcao').forEach(o => o.classList.remove('ativo'));
    document.getElementById(`raca-${id}`).classList.add('ativo');
}

function escolheClasse(id) {
    classeEscolhida = id;
    document.querySelectorAll('#lista-classes .opcao').forEach(o => o.classList.remove('ativo'));
    document.getElementById(`classe-${id}`).classList.add('ativo');
}

// CONFIRMAÇÃO
function confirma() {
    const nome = document.getElementById('nome').value.trim();
    
    if(!nome) return alert('Digite o nome!');
    if(!genEscolhido) return alert('Escolha o gênero!');
    if(!racaEscolhida) return alert('Escolha a raça!');
    if(!classeEscolhida) return alert('Escolha a classe!');
    
    alert(`Bem-vindo, ${nome}! ✅\nGênero: ${genEscolhido}\nRaça: ${racaEscolhida}\nClasse: ${classeEscolhida}`);
    
    // AQUI VOCÊ COLOCA A PRÓXIMA TELA DEPOIS
    // trocaTela('tela-cidade');
    vaiInicio();
}
</script>

</body>
</html>
