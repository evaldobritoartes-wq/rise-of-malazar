<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise of Malazar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0d12;
      color: #33ff33;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 10px;
    }
    header {
      text-align: center;
      padding: 6px 0;
      border-bottom: 2px solid #1f293d;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.2rem;
      color: #2ed573;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #70a1ff;
    }

    /* Tela de Criação e Carregamento */
    #creation-screen {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #050608;
      border: 1px solid #1f2a38;
      border-radius: 6px;
      padding: 16px;
      flex: 1;
      justify-content: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      color: #eccc68;
      font-weight: bold;
      font-size: 0.9rem;
    }
    input, select {
      background: #141824;
      border: 1px solid #2f3640;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .class-info {
      font-size: 0.75rem;
      color: #a4b0be;
      background: #10141d;
      padding: 8px;
      border-radius: 4px;
      border-left: 3px solid #70a1ff;
      margin-top: 4px;
    }

    /* Save Box */
    .save-box {
      background: #141824;
      border: 1px solid #2ed573;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      margin-bottom: 8px;
    }
    .save-box p {
      color: #2ed573;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    /* Layout do Jogo Principal */
    #game-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      height: 100%;
    }
    #enemy-hud {
      display: none;
      background: #1e1215;
      border: 1px solid #ff4757;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
      text-align: center;
    }
    .enemy-title {
      color: #ff4757;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .hp-bar-bg {
      background: #2f3542;
      border-radius: 4px;
      height: 12px;
      width: 100%;
      margin-top: 4px;
      overflow: hidden;
    }
    .hp-bar-fill {
      background: #ff4757;
      height: 100%;
      width: 100%;
      transition: width 0.3s;
    }
    #log {
      flex: 1;
      background-color: #050608;
      border: 1px solid #1f2a38;
      border-radius: 6px;
      padding: 10px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .entry { word-break: break-word; }
    .sys { color: #a4b0be; }
    .action { color: #ffa502; }
    .combat { color: #ff4757; }
    .heal { color: #2ed573; }
    .status { color: #1e90ff; }
    .danger { color: #ff6b81; font-weight: bold; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      background: #141824;
      border: 1px solid #2f3640;
      color: #eccc68;
      padding: 12px 6px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:active {
      background: #2f3542;
      transform: scale(0.98);
    }
    .btn-start { background: #2ed573; color: #050608; border-color: #2ed573; font-size: 1rem; padding: 12px; width: 100%; }
    .btn-load { background: #1e90ff; color: #ffffff; border-color: #1e90ff; font-size: 1rem; padding: 12px; width: 100%; }
    .btn-explore { border-color: #ff4757; color: #ff6b81; }
    .btn-status { border-color: #1e90ff; color: #70a1ff; }
    .btn-bag { border-color: #ffa502; color: #eccc68; }
    .btn-rest { border-color: #2ed573; color: #2ed573; }
    .btn-flee { border-color: #a4b0be; color: #a4b0be; }
  </style>
</head>
<body>

  <header>
    <h1>⚔️ RISE OF MALAZAR ⚔️</h1>
    <div class="subtitle" id="floor-display">Criação de Personagem</div>
  </header>

  <!-- TELA DE CRIAÇÃO / CARREGAMENTO -->
  <div id="creation-screen">
    <div id="save-prompt" class="save-box" style="display: none;">
      <p id="save-info-text">Jogo Guardado Encontrado!</p>
      <button class="btn-load" onclick="loadSavedGame()">📂 Continuar Jornada</button>
    </div>

    <div class="form-group">
      <label for="hero-name">Nome do Herói:</label>
      <input type="text" id="hero-name" placeholder="Ex: Dimitrian" value="Dimitrian" maxlength="15">
    </div>

    <div class="form-group">
      <label for="hero-class">Classe do Herói:</label>
      <select id="hero-class" onchange="updateClassPreview()">
        <option value="Guerreiro">🗡️ Guerreiro (Alta Vida / Ataque Forte)</option>
        <option value="Mago" selected>🪄 Mago (Alta Mana / Dano Mágico)</option>
        <option value="Ladino">🗡️ Ladino (Ataque Rápido / Fuga Fácil)</option>
        <option value="Clérigo">✝️ Clérigo (Equilibrado / Cura Eficiente)</option>
      </select>
    </div>

    <div class="class-info" id="class-preview">
      HP: 100 | MP: 100 | Habilidade: Bola de Fogo
    </div>

    <button class="btn-start" onclick="startNewGame()">🚀 Novo Jogo</button>
  </div>

  <!-- TELA DO JOGO -->
  <div id="game-screen">
    <div id="enemy-hud">
      <div class="enemy-title" id="enemy-name">Inimigo</div>
      <div style="font-size: 0.75rem; color: #ff6b81; margin-top: 2px;" id="enemy-hp-text">HP: 0/0</div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill" id="enemy-hp-fill"></div>
      </div>
    </div>

    <div id="log"></div>

    <div class="controls" id="action-buttons">
      <!-- Botões via JS -->
    </div>
  </div>

  <script>
    const classData = {
      'Guerreiro': { hp: 160, mana: 30, spellName: 'Golpe Devastador', spellCost: 10, spellDmg: [25, 35], desc: 'HP: 160 | MP: 30 | Habilidade: Golpe Devastador' },
      'Mago': { hp: 100, mana: 100, spellName: 'Bola de Fogo', spellCost: 15, spellDmg: [30, 45], desc: 'HP: 100 | MP: 100 | Habilidade: Bola de Fogo' },
      'Ladino': { hp: 120, mana: 50, spellName: 'Ataque Sombrio', spellCost: 12, spellDmg: [28, 40], desc: 'HP: 120 | MP: 50 | Habilidade: Ataque Sombrio' },
      'Clérigo': { hp: 140, mana: 70, spellName: 'Luz Sagrada', spellCost: 15, spellDmg: [20, 30], desc: 'HP: 140 | MP: 70 | Habilidade: Luz Sagrada' }
    };

    let hero = {};
    let currentFloor = 1;
    let inCombat = false;
    let currentEnemy = null;

    const creationScreen = document.getElementById('creation-screen');
    const gameScreen = document.getElementById('game-screen');
    const logDiv = document.getElementById('log');
    const enemyHud = document.getElementById('enemy-hud');
    const enemyNameEl = document.getElementById('enemy-name');
    const enemyHpTextEl = document.getElementById('enemy-hp-text');
    const enemyHpFillEl = document.getElementById('enemy-hp-fill');
    const floorDisplayEl = document.getElementById('floor-display');
    const buttonsContainer = document.getElementById('action-buttons');

    // Verificar se existe jogo guardado
    window.onload = () => {
      updateClassPreview();
      const savedData = localStorage.getItem('rom_save');
      if (savedData) {
        const data = JSON.parse(savedData);
        document.getElementById('save-prompt').style.display = 'block';
        document.getElementById('save-info-text').innerText = `Jogo Guardado: ${data.hero.name} (${data.hero.class}) - Andar ${data.floor}`;
      }
    };

    function updateClassPreview() {
      const selectedClass = document.getElementById('hero-class').value;
      document.getElementById('class-preview').innerText = classData[selectedClass].desc;
    }

    function saveGame() {
      if (!hero.isAlive) {
        localStorage.removeItem('rom_save');
        return;
      }
      const data = {
        hero: hero,
        floor: currentFloor
      };
      localStorage.setItem('rom_save', JSON.stringify(data));
    }

    function loadSavedGame() {
      const savedData = localStorage.getItem('rom_save');
      if (!savedData) return;

      const data = JSON.parse(savedData);
      hero = data.hero;
      currentFloor = data.floor;

      creationScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      floorDisplayEl.innerText = `Andar ${currentFloor} da Masmorra`;

      log(`[Sistema]: Jogo guardado carregado com sucesso!`, 'sys');
      log(`[Herói]: ${hero.name} (${hero.class}) regressou à aventura no Andar ${currentFloor}.`, 'action');

      updateControls();
    }

    function startNewGame() {
      const nameInput = document.getElementById('hero-name').value.trim();
      const selectedClass = document.getElementById('hero-class').value;
      const stats = classData[selectedClass];

      hero = {
        name: nameInput || 'Herói',
        class: selectedClass,
        hp: stats.hp,
        maxHp: stats.hp,
        mana: stats.mana,
        maxMana: stats.mana,
        gold: 150,
        potions: 2,
        weaponLvl: 1,
        armorLvl: 1,
        spellName: stats.spellName,
        spellCost: stats.spellCost,
        spellDmg: stats.spellDmg,
        isAlive: true
      };

      currentFloor = 1;
      creationScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      floorDisplayEl.innerText = `Andar 1 da Masmorra`;

      log(`[Sistema]: Bem-vindo ao Rise of Malazar!`, 'sys');
      log(`[Herói]: ${hero.name}, o ${hero.class}, iniciou a sua jornada!`, 'action');
      log(`[Masmorra]: Toque em "Explorar" para adentrar o Andar ${currentFloor}.`, 'sys');

      saveGame();
      updateControls();
    }

    function log(msg, type = 'sys') {
      const entry = document.createElement('div');
      entry.className = `entry ${type}`;
      entry.innerText = msg;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateControls() {
      if (!hero.isAlive) {
        localStorage.removeItem('rom_save');
        buttonsContainer.innerHTML = `<button class="btn-explore" style="grid-column: span 2;" onclick="location.reload()">🔄 Reiniciar Aventura</button>`;
        return;
      }

      if (inCombat) {
        buttonsContainer.innerHTML = `
          <button class="btn-explore" onclick="attackPhysical()">🗡️ Atacar</button>
          <button class="btn-status" onclick="attackMagic()">🪄 ${hero.spellName} (${hero.spellCost} MP)</button>
          <button class="btn-bag" onclick="usePotion()">🧪 Poção (${hero.potions})</button>
          <button class="btn-flee" onclick="flee()">🏃 Fugir</button>
        `;
      } else {
        buttonsContainer.innerHTML = `
          <button class="btn-explore" onclick="explore()">⚔️ Explorar</button>
          <button class="btn-status" onclick="showStatus()">📊 Status</button>
          <button class="btn-bag" onclick="shopMenu()">🛍️ Loja / Equipamentos</button>
          <button class="btn-rest" onclick="rest()">🍺 Taverna (30g)</button>
        `;
      }
    }

    function updateEnemyHud() {
      if (inCombat && currentEnemy) {
        enemyHud.style.display = 'block';
        enemyNameEl.innerText = `${currentEnemy.name} (Nível ${currentFloor})`;
        enemyHpTextEl.innerText = `HP: ${currentEnemy.hp}/${currentEnemy.maxHp}`;
        const pct = Math.max(0, (currentEnemy.hp / currentEnemy.maxHp) * 100);
        enemyHpFillEl.style.width = `${pct}%`;
      } else {
        enemyHud.style.display = 'none';
      }
    }

    function explore() {
      if (!hero.isAlive || inCombat) return;

      log(`[Masmorra]: Você explora as profundezas do Andar ${currentFloor}...`, 'action');

      const enemyTypes = [
        { name: 'Esqueleto', baseHp: 30, baseAtk: 10, baseGold: 20 },
        { name: 'Goblin', baseHp: 25, baseAtk: 8, baseGold: 15 },
        { name: 'Orc Guerreiro', baseHp: 50, baseAtk: 18, baseGold: 40 },
        { name: 'Cultista de Malazar', baseHp: 40, baseAtk: 15, baseGold: 35 }
      ];

      const template = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
      const hpMultiplier = 1 + (currentFloor - 1) * 0.25;
      const atkMultiplier = 1 + (currentFloor - 1) * 0.2;

      currentEnemy = {
        name: template.name,
        hp: Math.round(template.baseHp * hpMultiplier),
        maxHp: Math.round(template.baseHp * hpMultiplier),
        atk: Math.round(template.baseAtk * atkMultiplier),
        gold: Math.round(template.baseGold * hpMultiplier)
      };

      inCombat = true;
      log(`[Combate]: Um ${currentEnemy.name} bloqueia o seu caminho!`, 'danger');
      updateEnemyHud();
      updateControls();
    }

    function attackPhysical() {
      if (!inCombat) return;

      const weaponBonus = (hero.weaponLvl - 1) * 5;
      const dmg = Math.floor(Math.random() * 8) + 10 + weaponBonus;
      currentEnemy.hp -= dmg;
      log(`[Ataque]: ${hero.name} ataca causando ${dmg} de dano físico!`, 'combat');

      checkCombatState();
    }

    function attackMagic() {
      if (!inCombat) return;

      if (hero.mana < hero.spellCost) {
        log(`[Mana]: Mana insuficiente! Você precisa de ${hero.spellCost} MP.`, 'danger');
        return;
      }

      hero.mana -= hero.spellCost;
      const [minDmg, maxDmg] = hero.spellDmg;
      const weaponBonus = (hero.weaponLvl - 1) * 6;
      const dmg = Math.floor(Math.random() * (maxDmg - minDmg + 1)) + minDmg + weaponBonus;
      currentEnemy.hp -= dmg;
      log(`[Habilidade]: ${hero.name} usa ${hero.spellName} causando ${dmg} de dano!`, 'combat');

      checkCombatState();
    }

    function checkCombatState() {
      if (currentEnemy.hp <= 0) {
        currentEnemy.hp = 0;
        updateEnemyHud();
        log(`[Vitória]: O ${currentEnemy.name} foi derrotado! Você ganhou ${currentEnemy.gold}g.`, 'heal');
        hero.gold += currentEnemy.gold;
        inCombat = false;
        currentEnemy = null;
        
        currentFloor++;
        floorDisplayEl.innerText = `Andar ${currentFloor} da Masmorra`;
        
        saveGame();
        updateEnemyHud();
        updateControls();
        return;
      }

      updateEnemyHud();
      enemyTurn();
    }

    function enemyTurn() {
      const armorReduction = (hero.armorLvl - 1) * 3;
      const rawDmg = Math.floor(Math.random() * 6) + (currentEnemy.atk - 2);
      const enemyDmg = Math.max(2, rawDmg - armorReduction);

      hero.hp -= enemyDmg;
      log(`[Dano]: O ${currentEnemy.name} atacou e causou ${enemyDmg} de dano em ${hero.name}!`, 'danger');

      if (hero.hp <= 0) {
        hero.hp = 0;
        hero.isAlive = false;
        inCombat = false;
        log(`[DERROTA]: ${hero.name} caiu no Andar ${currentFloor}... O Malazar triunfou!`, 'danger');
        updateEnemyHud();
      }

      saveGame();
      updateControls();
    }

    function flee() {
      if (!inCombat) return;

      const chance = hero.class === 'Ladino' ? 0.7 : 0.4;
      if (Math.random() < chance) {
        log(`[Fuga]: Você conseguiu escapar com sucesso!`, 'sys');
        inCombat = false;
        currentEnemy = null;
        updateEnemyHud();
        updateControls();
      } else {
        log(`[Fuga]: Falha ao tentar fugir! O inimigo aproveitou o seu deslize.`, 'danger');
        enemyTurn();
      }
    }

    function showStatus() {
      log(`[Status]: ${hero.name} (${hero.class}) | HP: ${hero.hp}/${hero.maxHp} | MP: ${hero.mana}/${hero.maxMana} | Ouro: ${hero.gold}g | Poções: ${hero.potions}`, 'status');
      log(`[Equipamento]: Arma Nível ${hero.weaponLvl} | Armadura Nível ${hero.armorLvl}`, 'status');
    }

    function shopMenu() {
      const weaponCost = hero.weaponLvl * 50;
      const armorCost = hero.armorLvl * 50;
      log(`[Loja]: O que deseja comprar/melhorar?`, 'sys');
      log(`1. Poção de Cura (25g) | 2. Melhorar Arma Nv.${hero.weaponLvl+1} (${weaponCost}g) | 3. Melhorar Armadura Nv.${hero.armorLvl+1} (${armorCost}g)`, 'sys');

      buttonsContainer.innerHTML = `
        <button class="btn-bag" onclick="buyPotion()">🧪 Poção (25g)</button>
        <button class="btn-explore" onclick="upgradeWeapon()">🗡️ +Arma (${weaponCost}g)</button>
        <button class="btn-status" onclick="upgradeArmor()">🛡️ +Armadura (${armorCost}g)</button>
        <button class="btn-rest" onclick="updateControls()">⬅️ Voltar</button>
      `;
    }

    function upgradeWeapon() {
      const cost = hero.weaponLvl * 50;
      if (hero.gold < cost) {
        log(`[Loja]: Ouro insuficiente para melhorar a Arma (Custa ${cost}g).`, 'danger');
        return;
      }

      hero.gold -= cost;
      hero.weaponLvl++;
      log(`[Loja]: Arma melhorada para o Nível ${hero.weaponLvl}! Dano aumentado.`, 'heal');
      saveGame();
      shopMenu();
    }

    function upgradeArmor() {
      const cost = hero.armorLvl * 50;
      if (hero.gold < cost) {
        log(`[Loja]: Ouro insuficiente para melhorar a Armadura (Custa ${cost}g).`, 'danger');
        return;
      }

      hero.gold -= cost;
      hero.armorLvl++;
      hero.maxHp += 20;
      hero.hp += 20;
      log(`[Loja]: Armadura melhorada para o Nível ${hero.armorLvl}! Defesa e HP máximo aumentados (+20 HP).`, 'heal');
      saveGame();
      shopMenu();
    }

    function usePotion() {
      if (hero.potions <= 0) {
        log(`[Mochila]: Sem poções no inventário!`, 'danger');
        return;
      }
      if (hero.hp >= hero.maxHp) {
        log(`[Mochila]: Sua vida já está cheia.`, 'status');
        return;
      }

      hero.potions--;
      const heal = 50;
      hero.hp = Math.min(hero.maxHp, hero.hp + heal);
      log(`[Cura]: +${heal} HP recuperado! (HP: ${hero.hp}/${hero.maxHp})`, 'heal');

      saveGame();
      if (inCombat) {
        enemyTurn();
      } else {
        updateControls();
      }
    }

    function buyPotion() {
      if (hero.gold < 25) {
        log(`[Loja]: Ouro insuficiente para comprar uma poção (Custa 25g).`, 'danger');
        return;
      }

      hero.gold -= 25;
      hero.potions++;
      log(`[Loja]: Você comprou 1x Poção de Cura por 25g. Total de poções: ${hero.potions}`, 'heal');
      saveGame();
      shopMenu();
    }

    function rest() {
      if (hero.gold < 30) {
        log(`[Taverna]: Ouro insuficiente para descansar (Custa 30g).`, 'danger');
        return;
      }
      if (hero.hp === hero.maxHp && hero.mana === hero.maxMana) {
        log(`[Taverna]: Você já está com a vida e mana no máximo.`, 'status');
        return;
      }

      hero.gold -= 30;
      hero.hp = hero.maxHp;
      hero.mana = hero.maxMana;
      log(`[Taverna]: Você pagou 30g, descansou e recuperou todo HP e Mana!`, 'heal');
      saveGame();
    }
  </script>
</body>
</html>
